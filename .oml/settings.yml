# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@omniaeltayeb/concurrent-design"
  version: 0.1.0
  title: Concurrent Design
  description: Concurrent design method and model of an agricultural Earth observation satellite

# source folders
sources:
  - src

# oml server settings
#server:
#  port: 8080

# packing settings
pack:
  - include: [src/method]

# oml-cli parameter defaults
defaults:
  export: -o build/owl
  reason: -o build/owl -t
  render: -m src/model/md -b build/web -c src/model/oml/context-analysis/bundle.oml
  pack: -o build/dist
